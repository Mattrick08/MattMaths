<style>
:root{
  --paper: #F1EEE4;
  --paper-raised: #FBF9F2;
  --ink: #232B3D;
  --ink-soft: #5B6472;
  --ink-blue: #2C4870;
  --ink-blue-dim: #4A628C;
  --pen-red: #B8433A;
  --pen-red-dim: #E7D6D2;
  --pen-green: #3C7A5D;
  --pen-green-dim: #D8E3DA;
  --amber: #B8863A;
  --amber-dim: #E9DCC5;
  --grid-line: #DCD5C0;
  --shadow: rgba(35,43,61,0.12);
  --radius: 14px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
}

.app{ max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }

/* ---------- Typography ---------- */
h1, h2, h3, .display{
  font-family: 'Fraunces', serif;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.mono{ font-family: 'IBM Plex Mono', monospace; }
.eyebrow{
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ---------- Header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 36px;
  padding-bottom: 18px;
  border-bottom: 1.5px solid var(--ink);
}
.brand{ display:flex; align-items:baseline; gap:10px; }
.brand h1{ font-size: 28px; }
.brand .tag{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
.user-chip{
  display:flex; align-items:center; gap:10px;
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);
}
.btn-ghost{
  background:none; border:1px solid var(--ink-soft); color:var(--ink-soft);
  padding:6px 12px; border-radius:20px; font-family:'IBM Plex Mono',monospace;
  font-size:11px; cursor:pointer; transition: all .15s ease;
}
.btn-ghost:hover{ border-color:var(--ink); color:var(--ink); }

/* ---------- Buttons ---------- */
.btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  padding:11px 20px; border-radius:10px; border:none; cursor:pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background:var(--ink-blue); color:#fff; }
.btn-primary:hover{ background:var(--ink); }
.btn-outline{ background:transparent; border:1.5px solid var(--ink); color:var(--ink); }
.btn-outline:hover{ background:var(--ink); color:#fff; }
.btn-block{ width:100%; }
.btn-sm{ padding:7px 14px; font-size:13px; border-radius:8px; }
.btn-danger-text{ background:none; border:none; color:var(--pen-red); font-size:12px; cursor:pointer; font-family:'IBM Plex Mono',monospace; }

/* ---------- Auth screen ---------- */
.auth-wrap{ display:flex; justify-content:center; align-items:center; min-height:80vh; }
.auth-card{
  background: var(--paper-raised);
  border-radius: var(--radius);
  padding: 40px 36px;
  width: 100%; max-width: 380px;
  box-shadow: 0 8px 24px var(--shadow);
  border: 1px solid var(--grid-line);
  position: relative;
}
.auth-card::before{
  content:''; position:absolute; top:18px; left:0; right:0; height:1px;
  background: var(--grid-line);
}
.auth-card h2{ font-size:24px; margin-bottom:6px; }
.auth-card p.sub{ color:var(--ink-soft); font-size:13px; margin-bottom:24px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); margin-bottom:6px; }
.field input{
  width:100%; padding:11px 12px; border-radius:8px; border:1.5px solid var(--grid-line);
  background:#fff; font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
  outline:none; transition:border-color .15s ease;
}
.field input:focus{ border-color:var(--ink-blue); }
.auth-toggle{ text-align:center; margin-top:16px; font-size:13px; color:var(--ink-soft); }
.auth-toggle button{ background:none; border:none; color:var(--ink-blue); cursor:pointer; font-weight:600; font-size:13px; }
.auth-error{ background:var(--pen-red-dim); color:var(--pen-red); padding:10px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px; }

/* ---------- Stats bar ---------- */
.stats-row{ display:flex; gap:14px; margin-bottom:28px; flex-wrap:wrap; }
.stat-card{
  background:var(--paper-raised); border:1px solid var(--grid-line); border-radius:10px;
  padding:14px 18px; flex:1; min-width:130px;
}
.stat-card .num{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; line-height:1; }
.stat-card .label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
.stat-card.due .num{ color:var(--ink-blue); }

/* ---------- Deck grid (stacked-card look) ---------- */
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; margin-top: 8px;}
.deck-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:22px; }
.deck-card{
  position:relative;
  background: var(--paper-raised);
  border: 1.5px solid var(--ink);
  border-radius: 10px;
  padding: 18px 18px 16px;
  cursor:pointer;
  transition: transform .15s ease, box-shadow .15s ease;
  box-shadow: 4px 4px 0 var(--ink-blue-dim);
}
.deck-card:hover{ transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink-blue-dim); }
.deck-card::after{
  content:''; position:absolute; inset:-1.5px; border-radius:10px;
  border:1.5px solid var(--ink); z-index:-1; transform: rotate(-1.4deg);
  background: var(--paper-raised);
}
.deck-subject{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:5px;
  background:var(--amber-dim); color:var(--amber); margin-bottom:10px;
}
.deck-card h3{ font-size:18px; margin-bottom:14px; }
.deck-meta{ display:flex; justify-content:space-between; align-items:flex-end; }
.deck-due{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }
.deck-due.has-due{ color:var(--pen-red); font-weight:600; }
.deck-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }

.new-deck-tile{
  border: 1.5px dashed var(--ink-soft); border-radius:10px;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  min-height:118px; cursor:pointer; color:var(--ink-soft); transition: all .15s ease;
  gap:6px;
}
.new-deck-tile:hover{ border-color:var(--ink-blue); color:var(--ink-blue); }
.new-deck-tile .plus{ font-family:'Fraunces',serif; font-size:28px; line-height:1; }
.new-deck-tile span{ font-family:'IBM Plex Mono',monospace; font-size:11px; }

.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
.empty-state .display{ font-size:20px; margin-bottom:8px; }

/* ---------- Deck detail ---------- */
.back-link{
  font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);
  background:none; border:none; cursor:pointer; margin-bottom:18px; display:inline-flex; align-items:center; gap:6px;
}
.back-link:hover{ color:var(--ink); }
.deck-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:14px;}
.deck-header h2{ font-size:26px; }
.deck-actions{ display:flex; gap:10px; }

.card-list{ display:flex; flex-direction:column; gap:10px; }
.card-row{
  background:var(--paper-raised); border:1px solid var(--grid-line); border-radius:10px;
  padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:14px;
}
.card-row .front-preview{ font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-row .chapter-tag{
  font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);
  border:1px solid var(--grid-line); border-radius:5px; padding:2px 7px; white-space:nowrap;
}
.card-row .due-pill{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 8px; border-radius:12px; white-space:nowrap; }
.due-pill.today{ background:var(--pen-red-dim); color:var(--pen-red); }
.due-pill.future{ background:var(--grid-line); color:var(--ink-soft); }
.card-row-actions{ display:flex; gap:8px; }
.icon-btn{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:14px; padding:4px; }
.icon-btn:hover{ color:var(--ink); }

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(35,43,61,0.45); display:flex;
  align-items:center; justify-content:center; z-index:100; padding:20px;
  backdrop-filter: blur(2px);
}
.modal{
  background:var(--paper-raised); border-radius:var(--radius); padding:30px 30px 26px;
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}
.modal h3{ font-size:20px; margin-bottom:18px; }
textarea{
  width:100%; min-height:80px; padding:12px; border-radius:8px; border:1.5px solid var(--grid-line);
  font-family:'Inter',sans-serif; font-size:14px; resize:vertical; outline:none; background:#fff; color:var(--ink);
}
textarea:focus{ border-color:var(--ink-blue); }
.preview-box{
  margin-top:8px; padding:12px; border-radius:8px; background:var(--paper);
  border:1px dashed var(--grid-line); font-size:14px; min-height:20px;
}
.hint{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); margin-top:5px; }

/* ---------- Symbol toolbar ---------- */
.symbol-toolbar{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px; }
.symbol-btn{
  font-family:'IBM Plex Mono', monospace; font-size:13px; line-height:1;
  padding:6px 9px; border-radius:6px; border:1px solid var(--grid-line);
  background:#fff; color:var(--ink); cursor:pointer; min-width:30px; text-align:center;
  transition: border-color .12s ease, color .12s ease;
}
.symbol-btn:hover{ border-color:var(--ink-blue); color:var(--ink-blue); }
.symbol-btn.wide{ font-size:11px; padding:6px 8px; }

.bounds-popover{
  background:var(--paper); border:1px dashed var(--ink-blue);
  border-radius:8px; padding:12px; margin-bottom:9px;
}
.bp-row{ display:flex; gap:8px; margin-bottom:10px; }
.bp-field{ flex:1; }
.bp-field label{ display:block; font-size:10px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); margin-bottom:4px; }
.bp-field input{
  width:100%; padding:7px 8px; border-radius:6px; border:1px solid var(--grid-line);
  font-family:'Inter',sans-serif; font-size:13px; background:#fff; color:var(--ink); outline:none;
}
.bp-field input:focus{ border-color:var(--ink-blue); }
.bp-actions{ display:flex; justify-content:flex-end; gap:8px; }
.modal-footer{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
select{
  width:100%; padding:11px 12px; border-radius:8px; border:1.5px solid var(--grid-line);
  font-family:'Inter',sans-serif; font-size:14px; background:#fff; color:var(--ink); outline:none;
}

/* ---------- Review screen ---------- */
.review-wrap{ display:flex; flex-direction:column; align-items:center; padding: 20px 0 40px; }
.review-progress{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:22px; }
.scene{ perspective: 1400px; width:100%; max-width:520px; }
.fiche{
  position:relative; width:100%; min-height:280px;
  transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1);
  cursor:pointer;
}
.fiche.flipped{ transform: rotateY(180deg); }
.fiche-face{
  position:absolute; inset:0; backface-visibility:hidden;
  background: var(--paper-raised);
  border: 1.5px solid var(--ink);
  border-radius: 12px;
  padding: 40px 34px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  font-size: 19px; line-height:1.5;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 22px 22px;
  box-shadow: 5px 5px 0 var(--ink-blue-dim);
}
.fiche-face.back{ transform: rotateY(180deg); }
.fiche-face .corner-tag{
  position:absolute; top:14px; left:16px; font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;
}
.flip-hint{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:16px; }

.grade-row{ display:grid; grid-template-columns: repeat(4,1fr); gap:12px; margin-top:28px; width:100%; max-width:520px; }
.stamp-btn{
  font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em;
  padding:14px 6px; border-radius:8px; border:2px solid; cursor:pointer; background:#fff;
  transition: transform .08s ease;
}
.stamp-btn:hover{ transform: rotate(-1.5deg) scale(1.03); }
.stamp-btn:active{ transform: rotate(0) scale(0.96); }
.stamp-again{ border-color:var(--pen-red); color:var(--pen-red); }
.stamp-hard{ border-color:var(--amber); color:var(--amber); }
.stamp-good{ border-color:var(--ink-blue); color:var(--ink-blue); }
.stamp-easy{ border-color:var(--pen-green); color:var(--pen-green); }
.stamp-sub{ display:block; font-family:'Inter',sans-serif; font-weight:400; font-size:10px; text-transform:none; margin-top:2px; opacity:.75; }

.review-done{ text-align:center; padding:60px 20px; }
.review-done .display{ font-size:26px; margin-bottom:10px; }

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:#fff; padding:12px 20px; border-radius:8px;
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; z-index:200;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}

@media (max-width: 600px){
  .app{ padding:20px 14px 60px; }
  .grade-row{ grid-template-columns: repeat(2,1fr); }
  .fiche-face{ padding:28px 22px; font-size:17px; }
  .brand h1{ font-size:22px; }
}

.hidden{ display:none !important; }

/* ---------- Section tabs ---------- */
.section-tabs{ display:flex; gap:6px; margin-bottom:28px; }
.section-tab{
  font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:.05em;
  padding:8px 16px; border-radius:20px; border:1.5px solid var(--ink); background:transparent; color:var(--ink);
  cursor:pointer; transition: all .15s ease;
}
.section-tab.active{ background:var(--ink); color:#fff; }
.section-tab:not(.active):hover{ background:var(--grid-line); }

/* ---------- Weekly schedule grid ---------- */
.week-grid{
  display:flex; gap:2px; overflow-x:auto; background:var(--paper-raised);
  border:1px solid var(--grid-line); border-radius:10px; padding:14px;
}
.time-col{ width:38px; flex-shrink:0; }
.day-col{ flex:1; min-width:108px; position:relative; }
.day-header{
  font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center; color:var(--ink-soft);
  padding-bottom:8px; text-transform:uppercase; letter-spacing:.05em;
  border-bottom:1.5px solid var(--ink); margin-bottom:4px;
}
.time-labels{ position:relative; }
.hour-label{ position:absolute; font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); transform:translateY(-6px); right:6px; }
.day-body{
  position:relative;
  background-image: repeating-linear-gradient(to bottom, var(--grid-line) 0, var(--grid-line) 1px, transparent 1px, transparent 46px);
  border-left:1px solid var(--grid-line);
}
.sched-block{
  position:absolute; left:2px; right:2px; border-radius:6px; padding:4px 6px;
  background: var(--ink-blue); color:#fff; font-size:10.5px; overflow:hidden; cursor:pointer;
  box-shadow: 2px 2px 0 rgba(35,43,61,0.15);
}
.sched-block:hover{ background: var(--ink); }
.sched-block-subject{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; opacity:.85; text-transform:uppercase; letter-spacing:.03em; }
.sched-block-title{ font-weight:600; font-size:11px; line-height:1.25; margin:1px 0; }
.sched-block-time{ font-family:'IBM Plex Mono',monospace; font-size:9px; opacity:.85; }

/* ---------- Events / deadlines list ---------- */
.event-row{
  background:var(--paper-raised); border:1px solid var(--grid-line); border-radius:10px;
  padding:12px 16px; display:flex; align-items:center; gap:12px; margin-bottom:9px; flex-wrap:wrap;
}
.event-type-tag{
  font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
  padding:3px 8px; border-radius:5px; background:var(--amber-dim); color:var(--amber); white-space:nowrap;
}
.event-main{ flex:1; min-width:140px; }
.event-title{ font-weight:600; font-size:14px; }
.event-meta{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
.event-days{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; white-space:nowrap;
  padding:4px 10px; border-radius:12px; background:var(--grid-line); color:var(--ink-soft);
}
.event-row.urgency-urgent .event-days{ background:var(--pen-red-dim); color:var(--pen-red); }
.event-row.urgency-soon .event-days{ background:var(--amber-dim); color:var(--amber); }
.event-row.urgency-past{ opacity:.5; }

@media (max-width: 600px){
  .week-grid{ padding:10px; }
  .day-col{ min-width:92px; }
}
</style>

/* ---------------- SM-2 (simplified) ---------------- */
function applyGrade(card, grade){
  // grade: 'again' | 'hard' | 'good' | 'easy'
  let { ease_factor: ef, interval_days: iv, repetitions: reps } = card;
  ef = ef ?? 2.5; iv = iv ?? 0; reps = reps ?? 0;

  if(grade === 'again'){
    reps = 0;
    iv = 1;
    ef = Math.max(1.3, ef - 0.2);
  } else if(grade === 'hard'){
    iv = Math.max(1, iv * 1.2);
    ef = Math.max(1.3, ef - 0.15);
    reps += 1;
  } else if(grade === 'good'){
    if(reps === 0) iv = 1;
    else if(reps === 1) iv = 6;
    else iv = Math.round(iv * ef);
    reps += 1;
  } else if(grade === 'easy'){
    if(reps === 0) iv = 3;
    else iv = Math.round(iv * ef * 1.3);
    ef = ef + 0.15;
    reps += 1;
  }

  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + Math.round(iv));

  return {
    ease_factor: Math.round(ef*100)/100,
    interval_days: iv,
    repetitions: reps,
    next_review_date: nextDate.toISOString().slice(0,10),
    last_reviewed_at: new Date().toISOString(),
  };
}

/* ---------------- Data loading ---------------- */
async function loadDecks(){

/* ---------------- Review flow ---------------- */
function startReview(deckId){
  const today = new Date().toISOString().slice(0,10);
  const due = state.cards.filter(c => c.deck_id === deckId && c.next_review_date <= today);
  if(due.length === 0){ toast("Aucune fiche à réviser dans ce paquet aujourd'hui 🎉"); return; }
  state.reviewQueue = due.sort(() => Math.random() - 0.5);
  state.reviewIndex = 0;
  state.flipped = false;
  state.view = "review";
  render();
}

function flipCard(){
  state.flipped = !state.flipped;
  render();
}

async function gradeCard(grade){
  const card = state.reviewQueue[state.reviewIndex];
  const updates = applyGrade(card, grade);
  const { error } = await sb.from('cards').update(updates).eq('id', card.id);
  if(error) console.error(error);

  state.reviewIndex += 1;
  state.flipped = false;
  if(state.reviewIndex >= state.reviewQueue.length){
    render(); // will show "done" screen
  } else {
    render();
  }
}

async function finishReview(){
  await loadCards(state.currentDeckId);
  await loadDecks();
  state.view = "deck";
  render();
}

// Inserts `$` + before + content + after + `$` at the cursor, and selects `content`
// so the user can immediately type over the placeholder.
function insertMathWithSelection(textareaId, before, content, after){
  const ta = document.getElementById(textareaId);
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const mathText = before + content + after;
  const full = "$" + mathText + "$";
  ta.value = ta.value.slice(0, start) + full + ta.value.slice(end);
  const selStart = start + 1 + before.length;
  const selEnd = selStart + content.length;
  ta.focus();
  ta.setSelectionRange(selStart, selEnd);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

// Wraps the current selection (or a default placeholder) in a LaTeX template.
function wrapSelection(textareaId, before, after, placeholder){
  const ta = document.getElementById(textareaId);
  if(!ta) return;
  const selected = ta.value.slice(ta.selectionStart, ta.selectionEnd);
  const content = selected || placeholder;
  insertMathWithSelection(textareaId, before, content, after);
}

// Inserts a standalone math symbol, cursor placed right after the closing $.
function insertSimple(textareaId, latex){
  const ta = document.getElementById(textareaId);
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const full = "$" + latex + "$ ";
  ta.value = ta.value.slice(0, start) + full + ta.value.slice(end);
  const pos = start + full.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

// Opens a small inline popover under the toolbar to collect bounds for ∫ or ∑.
function openBoundsPopover(btn, textareaId, type){
  document.querySelectorAll('.bounds-popover').forEach(p => p.remove());
  const toolbar = btn.closest('.symbol-toolbar');
  if(!toolbar) return;

  const pop = document.createElement('div');
  pop.className = 'bounds-popover';

  if(type === 'int'){
    pop.innerHTML = `
      <div class="bp-row">
        <div class="bp-field"><label>Borne inf.</label><input type="text" class="bp-lower" value="0" /></div>
        <div class="bp-field"><label>Borne sup.</label><input type="text" class="bp-upper" value="1" /></div>
        <div class="bp-field"><label>Variable</label><input type="text" class="bp-var" value="x" /></div>
      </div>
      <div class="bp-actions">
        <button type="button" class="btn-ghost bp-cancel">Annuler</button>
        <button type="button" class="btn btn-primary btn-sm bp-insert">Insérer</button>
      </div>
    `;
  } else {
    pop.innerHTML = `
      <div class="bp-row">
        <div class="bp-field"><label>Indice</label><input type="text" class="bp-var" value="n" /></div>
        <div class="bp-field"><label>Val. initiale</label><input type="text" class="bp-lower" value="0" /></div>
        <div class="bp-field"><label>Val. finale</label><input type="text" class="bp-upper" value="N" /></div>
      </div>
      <div class="bp-actions">
        <button type="button" class="btn-ghost bp-cancel">Annuler</button>
        <button type="button" class="btn btn-primary btn-sm bp-insert">Insérer</button>
      </div>
    `;
  }

  toolbar.insertAdjacentElement('afterend', pop);
  pop.querySelector('.bp-lower').focus();

  pop.querySelector('.bp-cancel').addEventListener('click', () => pop.remove());
  pop.querySelector('.bp-insert').addEventListener('click', () => {
    const lower = pop.querySelector('.bp-lower').value.trim() || '0';
    const upper = pop.querySelector('.bp-upper').value.trim() || (type === 'int' ? '1' : 'N');
    const vr = pop.querySelector('.bp-var').value.trim() || (type === 'int' ? 'x' : 'n');

    if(type === 'int'){
      const content = `f(${vr})`;
      insertMathWithSelection(textareaId, `\\int_{${lower}}^{${upper}} `, content, `\\,d${vr}`);
    } else {
      const content = `u_{${vr}}`;
      insertMathWithSelection(textareaId, `\\sum_{${vr}=${lower}}^{${upper}} `, content, ``);
    }
    pop.remove();
  });
}

function handleSymbolAction(action, targetId, btn){
  switch(action){
    case 'sqrt':  wrapSelection(targetId, "\\sqrt{", "}", "x"); break;
    case 'pow':   wrapSelection(targetId, "^{", "}", "n"); break;
    case 'sub':   wrapSelection(targetId, "_{", "}", "n"); break;
    case 'frac':  wrapSelection(targetId, "\\frac{", "}{b}", "a"); break;
    case 'sum':   openBoundsPopover(btn, targetId, 'sum'); break;
    case 'int':   openBoundsPopover(btn, targetId, 'int'); break;
    case 'lim':   insertMathWithSelection(targetId, "\\lim_{x \\to ", "a", "}"); break;
    case 'pi':    insertSimple(targetId, "\\pi"); break;
    case 'infty': insertSimple(targetId, "\\infty"); break;
    case 'leq':   insertSimple(targetId, "\\leq"); break;
    case 'geq':   insertSimple(targetId, "\\geq"); break;
    case 'neq':   insertSimple(targetId, "\\neq"); break;
    case 'pm':    insertSimple(targetId, "\\pm"); break;
    case 'times': insertSimple(targetId, "\\times"); break;
    case 'to':    insertSimple(targetId, "\\to"); break;
    case 'alpha': insertSimple(targetId, "\\alpha"); break;
    case 'beta':  insertSimple(targetId, "\\beta"); break;
    case 'delta': insertSimple(targetId, "\\Delta"); break;
    case 'theta': insertSimple(targetId, "\\theta"); break;
  }
}

function attachSymbolToolbars(){
  el.querySelectorAll('.symbol-toolbar').forEach(toolbar => {
    const targetId = toolbar.getAttribute('data-target');
    toolbar.querySelectorAll('.symbol-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        handleSymbolAction(btn.getAttribute('data-action'), targetId, btn);
      });
    });
  });
}

            ${symbolToolbarHtml('card-back')}
            <textarea id="card-back" placeholder="Réponse.">${escapeHtml(c?.back || "")}</textarea>
            <div class="preview-box" id="back-preview"></div>
          </div>
          <div class="field">
            <label>Chapitre (optionnel)</label>
            <input id="card-chapter" type="text" value="${escapeHtml(c?.chapter || "")}" placeholder="Ex : Chapitre 4"
              style="width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--grid-line);font-family:'Inter',sans-serif;font-size:14px;" />
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline btn-sm" id="card-cancel">Annuler</button>
            <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderReview(){
  if(state.reviewIndex >= state.reviewQueue.length){
    return `
      <div class="review-done">
        <div class="display">Séance terminée 🎉</div>
        <p style="color:var(--ink-soft); margin-bottom:22px;">${state.reviewQueue.length} fiche${state.reviewQueue.length !== 1 ? 's' : ''} revue${state.reviewQueue.length !== 1 ? 's' : ''}.</p>
        <button class="btn btn-primary" id="finish-review-btn">Retour au paquet</button>
      </div>
    `;
  }
  const card = state.reviewQueue[state.reviewIndex];
  return `
    <div class="review-wrap">
      <div class="review-progress">FICHE ${state.reviewIndex + 1} / ${state.reviewQueue.length}</div>
      <div class="scene">
        <div class="fiche ${state.flipped ? 'flipped' : ''}" id="fiche-el">
          <div class="fiche-face front">
            <span class="corner-tag">Recto</span>
            <div>${escapeHtml(card.front)}</div>
          </div>
          <div class="fiche-face back">
            <span class="corner-tag">Verso</span>
            <div>${escapeHtml(card.back)}</div>
          </div>
        </div>
      </div>
      <div class="flip-hint">${state.flipped ? "clique pour revoir le recto" : "clique sur la fiche pour révéler la réponse"}</div>
      <div class="grade-row">
        <button class="stamp-btn stamp-again" data-grade="again" ${!state.flipped ? 'disabled style="opacity:.35;cursor:not-allowed;"' : ''}>À revoir<span class="stamp-sub">1 jour</span></button>
        <button class="stamp-btn stamp-hard" data-grade="hard" ${!state.flipped ? 'disabled style="opacity:.35;cursor:not-allowed;"' : ''}>Difficile<span class="stamp-sub">×1.2</span></button>
        <button class="stamp-btn stamp-good" data-grade="good" ${!state.flipped ? 'disabled style="opacity:.35;cursor:not-allowed;"' : ''}>Bien<span class="stamp-sub">×EF</span></button>
        <button class="stamp-btn stamp-easy" data-grade="easy" ${!state.flipped ? 'disabled style="opacity:.35;cursor:not-allowed;"' : ''}>Facile<span class="stamp-sub">×EF×1.3</span></button>
      </div>
    </div>
  `;
}

/* ---------------- Planning: rendering ---------------- */
const PLANNING_DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const PLANNING_DAYS_SHORT = ["Lun","Mar","Mer","Jeu","Ven","Sam"];
const EVENT_TYPES = ["DS","Devoir","Colle","Deadline","Autre"];
const GRID_START_H = 8;
const GRID_END_H = 19;
const HOUR_HEIGHT = 46;

function timeToMinutes(t){
  if(!t) return 0;
  const parts = t.split(':');
  return parseInt(parts[0],10) * 60 + parseInt(parts[1],10);
}
function fmtTimeShort(t){
  return t ? t.slice(0,5) : '';
}
function fmtDateFr(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}

function renderPlanning(){
  return `
    <div class="section-head">
      <h2 class="display" style="font-size:20px;">Emploi du temps</h2>
      <button class="btn btn-outline btn-sm" id="add-block-btn">+ Ajouter un cours</button>
    </div>
    ${renderWeekGrid()}

    <div class="section-head" style="margin-top:36px;">
      <h2 class="display" style="font-size:20px;">Échéances à venir</h2>
      <button class="btn btn-outline btn-sm" id="add-event-btn">+ Ajouter une échéance</button>
    </div>
    ${renderEventsList()}

    ${state.showBlockModal ? renderBlockModal() : ""}
    ${state.showEventModal ? renderEventModal() : ""}
  `;
}

function renderWeekGrid(){
  const totalHeight = (GRID_END_H - GRID_START_H) * HOUR_HEIGHT;

  let hourLabels = "";
  for(let h = GRID_START_H; h <= GRID_END_H; h++){
    hourLabels += `<div class="hour-label" style="top:${(h - GRID_START_H) * HOUR_HEIGHT}px">${h}h</div>`;
  }

  const dayColumns = PLANNING_DAYS_SHORT.map((label, dayIdx) => {
    const blocks = state.scheduleBlocks.filter(b => b.day_of_week === dayIdx);
    const blockEls = blocks.map(b => {
      const startMin = timeToMinutes(b.start_time);
      const endMin = timeToMinutes(b.end_time);
      const top = ((startMin - GRID_START_H * 60) / 60) * HOUR_HEIGHT;
      const height = Math.max(20, ((endMin - startMin) / 60) * HOUR_HEIGHT);
      return `
        <div class="sched-block" style="top:${top}px; height:${height}px;" data-edit-block="${b.id}">
          <div class="sched-block-subject">${escapeHtml(b.subject)}</div>
          <div class="sched-block-title">${escapeHtml(b.title)}</div>
          <div class="sched-block-time">${fmtTimeShort(b.start_time)}–${fmtTimeShort(b.end_time)}</div>
        </div>
      `;
    }).join("");
    return `
      <div class="day-col">
        <div class="day-header">${label}</div>
        <div class="day-body" style="height:${totalHeight}px;">${blockEls}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="week-grid">
      <div class="time-col">
        <div class="day-header"></div>
        <div class="time-labels" style="height:${totalHeight}px;">${hourLabels}</div>
      </div>
      ${dayColumns}
    </div>
  `;
}

function renderEventsList(){
  if(state.events.length === 0){
    return `
      <div class="empty-state">
        <div class="display">Aucune échéance</div>
        <p>Ajoute un DS, un devoir ou une colle à venir.</p>
      </div>
    `;
  }

  const today = new Date();
  today.setHours(0,0,0,0);
  const sorted = [...state.events].sort((a,b) => a.event_date.localeCompare(b.event_date));

  const rows = sorted.map(e => {
    const evDate = new Date(e.event_date + 'T00:00:00');
    const diffDays = Math.round((evDate - today) / 86400000);
    let urgency = 'later';
    if(diffDays < 0) urgency = 'past';
    else if(diffDays <= 2) urgency = 'urgent';
    else if(diffDays <= 7) urgency = 'soon';
    const daysLabel = diffDays === 0 ? "aujourd'hui" : diffDays === 1 ? "demain" : diffDays < 0 ? `il y a ${Math.abs(diffDays)}j` : `dans ${diffDays}j`;
    return `
      <div class="event-row urgency-${urgency}">
        <div class="event-type-tag">${escapeHtml(e.event_type)}</div>
        <div class="event-main">
          <div class="event-title">${escapeHtml(e.title)}</div>
          <div class="event-meta">${escapeHtml(e.subject)} · ${fmtDateFr(e.event_date)}${e.event_time ? ' · ' + fmtTimeShort(e.event_time) : ''}</div>
        </div>
        <div class="event-days">${daysLabel}</div>
        <div class="card-row-actions">
          <button class="icon-btn" data-edit-event="${e.id}" title="Modifier">✎</button>
          <button class="icon-btn" data-delete-event="${e.id}" title="Supprimer">✕</button>
        </div>
      </div>
    `;
  }).join("");

  return `<div class="card-list">${rows}</div>`;
}

function renderBlockModal(){
  const b = state.editingBlock;
  const dayOptions = PLANNING_DAYS.map((d,i) => `<option value="${i}" ${b && b.day_of_week === i ? 'selected' : ''}>${d}</option>`).join("");
  const subjOptions = SUBJECTS.map(s => `<option value="${s}" ${b && b.subject === s ? 'selected' : ''}>${s}</option>`).join("");
  return `
    <div class="modal-backdrop" id="block-modal-backdrop">
      <div class="modal">
        <h3>${b ? "Modifier le cours" : "Nouveau cours"}</h3>
        <form id="block-form">
          <div class="field">
            <label>Intitulé</label>
            <input id="block-title" type="text" required value="${escapeHtml(b?.title || '')}" placeholder="Ex : Colle de maths, TD physique..."
              style="width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--grid-line);font-family:'Inter',sans-serif;font-size:14px;" />
          </div>
          <div class="field">
            <label>Matière</label>
            <select id="block-subject">${subjOptions}</select>
          </div>
          <div class="field">
            <label>Jour</label>
            <select id="block-day">${dayOptions}</select>
          </div>
          <div class="bp-row">
            <div class="bp-field"><label>Début</label><input type="time" id="block-start" value="${b?.start_time ? b.start_time.slice(0,5) : '08:00'}" /></div>
            <div class="bp-field"><label>Fin</label><input type="time" id="block-end" value="${b?.end_time ? b.end_time.slice(0,5) : '09:00'}" /></div>
          </div>
          <div class="field">
            <label>Salle (optionnel)</label>
            <input id="block-room" type="text" value="${escapeHtml(b?.room || '')}"
              style="width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--grid-line);font-family:'Inter',sans-serif;font-size:14px;" />
          </div>
          <div class="modal-footer">
            ${b ? `<button type="button" class="btn-danger-text" id="block-delete" style="margin-right:auto;">Supprimer</button>` : ""}
            <button type="button" class="btn btn-outline btn-sm" id="block-cancel">Annuler</button>
            <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderEventModal(){
  const e = state.editingEvent;
  const typeOptions = EVENT_TYPES.map(t => `<option value="${t}" ${e && e.event_type === t ? 'selected' : ''}>${t}</option>`).join("");
  const subjOptions = SUBJECTS.map(s => `<option value="${s}" ${e && e.subject === s ? 'selected' : ''}>${s}</option>`).join("");
  return `
    <div class="modal-backdrop" id="event-modal-backdrop">
      <div class="modal">
        <h3>${e ? "Modifier l'échéance" : "Nouvelle échéance"}</h3>
        <form id="event-form">
          <div class="field">
            <label>Titre</label>
            <input id="event-title" type="text" required value="${escapeHtml(e?.title || '')}" placeholder="Ex : DS n°4"
              style="width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--grid-line);font-family:'Inter',sans-serif;font-size:14px;" />
          </div>
          <div class="bp-row">
            <div class="bp-field"><label>Type</label><select id="event-type">${typeOptions}</select></div>
            <div class="bp-field"><label>Matière</label><select id="event-subject">${subjOptions}</select></div>
          </div>
          <div class="bp-row">
            <div class="bp-field"><label>Date</label><input type="date" id="event-date" required value="${e?.event_date || ''}" /></div>
            <div class="bp-field"><label>Heure (optionnel)</label><input type="time" id="event-time" value="${e?.event_time ? e.event_time.slice(0,5) : ''}" /></div>
          </div>
          <div class="field">
            <label>Notes (optionnel)</label>
            <textarea id="event-notes" style="min-height:60px;">${escapeHtml(e?.notes || '')}</textarea>
          </div>
          <div class="modal-footer">
            ${e ? `<button type="button" class="btn-danger-text" id="event-delete" style="margin-right:auto;">Supprimer</button>` : ""}
            <button type="button" class="btn btn-outline btn-sm" id="event-cancel">Annuler</button>
            <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

/* ---------------- Event delegation ---------------- */
function attachViewHandlers(){
  // Dashboard
  el.querySelectorAll('[data-open-deck]').forEach(node => {
    node.addEventListener('click', async () => {
      state.currentDeckId = node.getAttribute('data-open-deck');
      state.view = 'deck';
      await loadCards(state.currentDeckId);
    });
  });
  document.getElementById('new-deck-tile')?.addEventListener('click', () => {
    state.showDeckModal = true; render();
  });
  document.getElementById('deck-modal-backdrop')?.addEventListener('click', (e) => {
    if(e.target.id === 'deck-modal-backdrop'){ state.showDeckModal = false; render(); }
  });
  document.getElementById('deck-cancel')?.addEventListener('click', () => { state.showDeckModal = false; render(); });
  document.getElementById('deck-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('deck-name').value.trim();
    const subject = document.getElementById('deck-subject').value;
    if(name) createDeck(name, subject);
  });

  // Deck detail
  document.getElementById('back-to-dashboard')?.addEventListener('click', () => {
    state.view = 'dashboard'; state.currentDeckId = null; render();
  });
  document.getElementById('delete-deck-btn')?.addEventListener('click', () => {
    deleteDeck(state.currentDeckId).then(() => { state.view = 'dashboard'; state.currentDeckId = null; });
  });
  document.getElementById('start-review-btn')?.addEventListener('click', () => startReview(state.currentDeckId));
  document.getElementById('add-card-btn')?.addEventListener('click', () => {
    state.editingCard = null; state.showCardModal = true; render();
  });
  el.querySelectorAll('[data-edit-card]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cardId = btn.getAttribute('data-edit-card');
      state.editingCard = state.cards.find(c => c.id === cardId);
      state.showCardModal = true; render();
    });
  });
  el.querySelectorAll('[data-delete-card]').forEach(btn => {
    btn.addEventListener('click', () => deleteCard(btn.getAttribute('data-delete-card')));
  });
  document.getElementById('card-modal-backdrop')?.addEventListener('click', (e) => {
    if(e.target.id === 'card-modal-backdrop'){ state.showCardModal = false; state.editingCard = null; render(); }
  });
  document.getElementById('card-cancel')?.addEventListener('click', () => {
    state.showCardModal = false; state.editingCard = null; render();
  });
  document.getElementById('card-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const front = document.getElementById('card-front').value.trim();
    const back = document.getElementById('card-back').value.trim();
    const chapter = document.getElementById('card-chapter').value.trim();
    if(front && back) saveCard(front, back, chapter);
  });
  // Live LaTeX preview
  const frontTa = document.getElementById('card-front');
  const backTa = document.getElementById('card-back');
  if(frontTa){
    const updatePreview = () => {
      const fp = document.getElementById('front-preview');
      const bp = document.getElementById('back-preview');
      fp.textContent = frontTa.value;
      bp.textContent = backTa.value;
      renderLatex(fp); renderLatex(bp);
    };
    frontTa.addEventListener('input', updatePreview);
    backTa.addEventListener('input', updatePreview);
    updatePreview();
  }

  // Review
  document.getElementById('fiche-el')?.addEventListener('click', flipCard);
  el.querySelectorAll('[data-grade]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!state.flipped) return;
      gradeCard(btn.getAttribute('data-grade'));
    });
  });
  document.getElementById('finish-review-btn')?.addEventListener('click', finishReview);

  // Planning: schedule blocks
  document.getElementById('add-block-btn')?.addEventListener('click', () => {
    state.editingBlock = null; state.showBlockModal = true; render();
  });
  el.querySelectorAll('[data-edit-block]').forEach(node => {
    node.addEventListener('click', () => {
      const id = node.getAttribute('data-edit-block');
      state.editingBlock = state.scheduleBlocks.find(b => b.id === id);
      state.showBlockModal = true; render();
    });
  });
  document.getElementById('block-modal-backdrop')?.addEventListener('click', (e) => {
    if(e.target.id === 'block-modal-backdrop'){ state.showBlockModal = false; state.editingBlock = null; render(); }
  });
  document.getElementById('block-cancel')?.addEventListener('click', () => {
    state.showBlockModal = false; state.editingBlock = null; render();
  });
  document.getElementById('block-delete')?.addEventListener('click', async () => {
    await deleteBlock(state.editingBlock.id);
    state.showBlockModal = false; state.editingBlock = null; render();
  });
  document.getElementById('block-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const block = {
      title: document.getElementById('block-title').value.trim(),
      subject: document.getElementById('block-subject').value,
      day_of_week: parseInt(document.getElementById('block-day').value, 10),
      start_time: document.getElementById('block-start').value,
      end_time: document.getElementById('block-end').value,
      room: document.getElementById('block-room').value.trim(),
    };
    if(block.title && block.start_time && block.end_time) saveBlock(block);
  });

  // Planning: events / deadlines
  document.getElementById('add-event-btn')?.addEventListener('click', () => {
    state.editingEvent = null; state.showEventModal = true; render();
  });
  el.querySelectorAll('[data-edit-event]').forEach(node => {
    node.addEventListener('click', () => {
      const id = node.getAttribute('data-edit-event');
      state.editingEvent = state.events.find(ev => ev.id === id);
      state.showEventModal = true; render();
    });
  });
  el.querySelectorAll('[data-delete-event]').forEach(btn => {
    btn.addEventListener('click', () => deleteEvent(btn.getAttribute('data-delete-event')));
  });
  document.getElementById('event-modal-backdrop')?.addEventListener('click', (e) => {
    if(e.target.id === 'event-modal-backdrop'){ state.showEventModal = false; state.editingEvent = null; render(); }
  });
  document.getElementById('event-cancel')?.addEventListener('click', () => {
    state.showEventModal = false; state.editingEvent = null; render();
  });
  document.getElementById('event-delete')?.addEventListener('click', async () => {
    await deleteEvent(state.editingEvent.id);
    state.showEventModal = false; state.editingEvent = null; render();
  });
  document.getElementById('event-form')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const evt = {
      title: document.getElementById('event-title').value.trim(),
      event_type: document.getElementById('event-type').value,
      subject: document.getElementById('event-subject').value,
      event_date: document.getElementById('event-date').value,
      event_time: document.getElementById('event-time').value || null,
      notes: document.getElementById('event-notes').value.trim(),
    };
    if(evt.title && evt.event_date) saveEvent(evt);
  });
}

/* ---------------- Boot / auth listener ---------------- */
sb.auth.onAuthStateChange(async (event, session) => {
  if(session?.user){
    state.user = session.user;
    state.view = "dashboard";
    await Promise.all([loadDecks(), loadScheduleBlocks(), loadEvents()]);
  } else {
    state.user = null;
    state.view = "auth";
    render();
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if(session?.user){
    state.user = session.user;
    state.view = "dashboard";
    await Promise.all([loadDecks(), loadScheduleBlocks(), loadEvents()]);
  } else {
    state.view = "auth";
    render();
  }
})();
</script>
